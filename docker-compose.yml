services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  trends:
    build:
      context: .
      target: trends
    depends_on:
      - nats
    environment:
      NATS_URL: nats://nats:4222
      HTTP_ADDR: :8080
      WINDOW_DURATION: 5m
      BUCKET_DURATION: 1s
      LATENESS_TOLERANCE: 10s
      SNAPSHOT_INTERVAL: 1s
      MAX_TOP_LIMIT: 1000
    ports:
      - "8080:8080"

  loadgen:
    build:
      context: .
      target: loadgen
    profiles: ["load"]
    depends_on:
      - nats
    environment:
      NATS_URL: nats://nats:4222
      RPS: 1000
      DURATION: 60s

volumes:
  nats-data:

